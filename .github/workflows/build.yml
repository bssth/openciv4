name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache third-party packages
        id: deps
        uses: actions/cache@v4
        with:
          path: external
          key: deps-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Fetch third-party packages
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force external\downloads | Out-Null
          function Get-Archive($url, $file) { Invoke-WebRequest $url -OutFile "external\downloads\$file" }

          Get-Archive https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi python.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/a', "`"$PWD\external\downloads\python.msi`"", '/qn', "TARGETDIR=`"$PWD\external\python27`""
          if (-not (Test-Path external\python27\libs\python27.lib)) { throw "Python 2.7 did not unpack" }

          Get-Archive https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz zlib.tar.gz
          tar -xzf external\downloads\zlib.tar.gz -C external

          Get-Archive https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.zip sdl3.zip
          Expand-Archive external\downloads\sdl3.zip external

          New-Item -ItemType Directory -Force external\dr_libs | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/mackron/dr_libs/aec2dd20667f54acfdb66031217df6d240f56c52/dr_mp3.h -OutFile external\dr_libs\dr_mp3.h

          Get-Archive https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip ffmpeg.zip
          Expand-Archive external\downloads\ffmpeg.zip external
          Rename-Item external\ffmpeg-n8.1-latest-win64-lgpl-shared-8.1 ffmpeg-8.1

          Remove-Item -Recurse external\downloads

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake --preset release
          cmake --build build\Release

      - name: Test
        run: ctest --test-dir build\Release --output-on-failure

      # Python 2.7 needs the Visual C++ 2008 runtime, which the package carries beside it.
      - name: Visual C++ 2008 runtime
        shell: pwsh
        run: |
          if (-not (Get-ChildItem C:\Windows\WinSxS -Directory -Filter "amd64_microsoft.vc90.crt_1fc8b3b9a1e18e3b_*")) {
            choco install vcredist2008 -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          tools\make-demo.ps1 -Mod vanilla -Version $version -Out build\dist

      - uses: actions/upload-artifact@v4
        with:
          name: openciv4-windows-x64
          path: build/dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openciv4-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          prerelease: true
          generate_release_notes: true
