name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache third-party packages
        id: deps
        uses: actions/cache@v4
        with:
          path: external
          key: deps-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Fetch third-party packages
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force external\downloads | Out-Null
          function Get-Archive($url, $file) { Invoke-WebRequest $url -OutFile "external\downloads\$file" }

          Get-Archive https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi python.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/a', "`"$PWD\external\downloads\python.msi`"", '/qn', "TARGETDIR=`"$PWD\external\python27`""
          if (-not (Test-Path external\python27\libs\python27.lib)) { throw "Python 2.7 did not unpack" }

          Get-Archive https://github.com/pybind/pybind11/archive/refs/tags/v2.9.2.zip pybind11.zip
          Expand-Archive external\downloads\pybind11.zip external

          Get-Archive https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz zlib.tar.gz
          tar -xzf external\downloads\zlib.tar.gz -C external

          Get-Archive https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.zip sdl3.zip
          Expand-Archive external\downloads\sdl3.zip external

          New-Item -ItemType Directory -Force external\dr_libs | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/mackron/dr_libs/aec2dd20667f54acfdb66031217df6d240f56c52/dr_mp3.h -OutFile external\dr_libs\dr_mp3.h

          Get-Archive https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip ffmpeg.zip
          Expand-Archive external\downloads\ffmpeg.zip external
          Rename-Item external\ffmpeg-n8.1-latest-win64-lgpl-shared-8.1 ffmpeg-8.1

          Remove-Item -Recurse external\downloads

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake --preset release
          cmake --build build\Release

      - name: Test
        run: ctest --test-dir build\Release --output-on-failure

      # Python 2.7 needs the Visual C++ 2008 runtime, which the package carries beside it.
      - name: Visual C++ 2008 runtime
        shell: pwsh
        run: |
          if (-not (Get-ChildItem C:\Windows\WinSxS -Directory -Filter "amd64_microsoft.vc90.crt_1fc8b3b9a1e18e3b_*")) {
            choco install vcredist2008 -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          tools\make-demo.ps1 -Mod vanilla -Version $version -Out build\dist

      - uses: actions/upload-artifact@v4
        with:
          name: openciv4-windows-x64
          path: build/dist/*.zip

  # The native Apple Silicon build (README, "Building (macOS, Apple Silicon)") and its tests, and the
  # checked-in Metal shaders compiled with Apple's compiler: the game itself compiles them only when
  # it starts, so a translation Metal rejects would otherwise first fail on a player's Mac.
  macos-arm64:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # The game core and SDL have precompiled headers: ccache uses them only with these (and -fno-pch-timestamp).
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Tools
        run: |
          brew install ninja gettext ccache
          cmake --version | head -n 1
          # The image's default Xcode 16's libc++ lacks std::jthread: use the newest Xcode 26 on it.
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version
          # Xcode 26 ships the Metal compiler as a separate download.
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version

      - name: Cache Python 2.7
        id: python
        uses: actions/cache@v4
        with:
          path: ~/.pyenv/versions/2.7.18
          key: python-2.7.18-shared-macos-15-${{ runner.arch }}

      # There is no Homebrew formula for Python 2.7; the game needs it as a shared library.
      - name: Build Python 2.7
        if: steps.python.outputs.cache-hit != 'true'
        run: |
          brew install pyenv
          PYTHON_CONFIGURE_OPTS=--enable-shared pyenv install 2.7.18

      - name: Cache third-party packages
        id: deps
        uses: actions/cache@v4
        with:
          path: external
          key: deps-macos-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Fetch third-party packages
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p external/dr_libs
          get() { curl -sSfL "$1" | tar -xz -C external; }
          get https://github.com/pybind/pybind11/archive/refs/tags/v2.9.2.tar.gz
          get https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          get https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          get https://github.com/freetype/freetype/archive/refs/tags/VER-2-13-3.tar.gz
          mv external/freetype-VER-2-13-3 external/freetype-2.13.3
          get https://github.com/microsoft/DirectXMath/archive/refs/tags/jun2026.tar.gz
          mv external/DirectXMath-jun2026 external/DirectXMath
          curl -sSfL -o external/dr_libs/dr_mp3.h https://raw.githubusercontent.com/mackron/dr_libs/aec2dd20667f54acfdb66031217df6d240f56c52/dr_mp3.h
          ls external

      # Compiled objects from earlier runs: a change recompiles only what it touches. A cache entry
      # cannot be overwritten, so each run saves a new one and restores the latest.
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-macos-

      - name: Build
        run: |
          ccache --zero-stats
          cmake -S . -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DOC4_PYTHON27_DIR=$HOME/.pyenv/versions/2.7.18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_FLAGS="-Xclang -fno-pch-timestamp" -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"
          cmake --build build/macos
          ccache --show-stats -v

      - name: Test
        run: ctest --test-dir build/macos --output-on-failure

      - name: Compile the Metal shaders
        run: python3 tools/shaders/check_msl.py

  # The Metal and Vulkan translations of the shaders are checked in. This fails when they are
  # not what the HLSL in the sources translates to, with the tools of one pinned Vulkan SDK
  # (the files are generated with these versions: glslang, spirv-cross, spirv-opt, spirv-val).
  shaders:
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
      VULKAN_SDK_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
    steps:
      - uses: actions/checkout@v4

      - name: Cache the shader tools
        id: sdk
        uses: actions/cache@v4
        with:
          path: vulkan-sdk
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Fetch the shader tools
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          echo "$VULKAN_SDK_SHA256  sdk.tar.xz" | sha256sum -c -
          mkdir vulkan-sdk
          tar -xJf sdk.tar.xz -C vulkan-sdk --strip-components=2 "$VULKAN_SDK_VERSION/x86_64/bin" "$VULKAN_SDK_VERSION/x86_64/lib"
          rm sdk.tar.xz

      - name: Check the generated shaders
        run: |
          export PATH="$PWD/vulkan-sdk/bin:$PATH" LD_LIBRARY_PATH="$PWD/vulkan-sdk/lib"
          glslang --version | head -n 1
          spirv-opt --version | head -n 1
          python3 tools/shaders/gen_msl.py --check
          python3 tools/shaders/gen_spirv.py --check

  release:
    if: github.ref_type == 'tag'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openciv4-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          prerelease: true
          generate_release_notes: true
